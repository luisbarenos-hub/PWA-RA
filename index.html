<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Meta etiqueta responsive ajustada para móviles y APK -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Juego AR PWA</title>

  <!-- Enlace al Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Configuración e Iconos para iOS (Safari) / Android -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3612/3612580.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JuegoAR">
  <meta name="theme-color" content="#000000">

  <!-- Librerías de Realidad Aumentada (A-Frame + AR.js) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Estilos CSS de la Aplicación -->
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Interfaz Flotante (HUD) */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      text-align: center;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      pointer-events: none; /* Permite interactuar con el lienzo 3D detrás */
    }

    #score-text {
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 0.5px;
    }

    #instructions {
      font-size: 13px;
      margin-top: 4px;
      color: #b0bec5;
    }
  </style>
</head>
<body>

  <!-- Interfaz de Usuario flotante superior -->
  <div id="ui-container">
    <p id="score-text">Puntos: 0</p>
    <div id="instructions">Apunta al marcador HIRO y toca el cubo</div>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Marcador Estándar HIRO -->
    <a-marker preset="hiro">
      <!-- Objeto Interactivo 3D (Cubo) -->
      <a-box 
        id="target-cube" 
        position="0 0.5 0" 
        material="color: #FF5722;" 
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
      </a-box>
    </a-marker>

    <!-- Cámara con raycaster para interacción táctil -->
    <a-entity camera raycaster="objects: a-box" cursor="rayOrigin: mouse"></a-entity>
    
  </a-scene>

  <!-- Lógica JavaScript del Juego y PWA -->
  <script>
    // 1. LÓGICA DEL JUEGO
    let score = 0;
    const colors = ['#FF5722', '#4CAF50', '#2196F3', '#9C27B0', '#FFEB3B', '#E91E63'];
    
    const cube = document.getElementById('target-cube');
    const scoreDisplay = document.getElementById('score-text');

    cube.addEventListener('click', function () {
      score++;
      scoreDisplay.textContent = `Puntos: ${score}`;

      // Cambio de color aleatorio
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      cube.setAttribute('material', 'color', randomColor);

      // Feedback visual de toque
      cube.setAttribute('scale', '1.3 1.3 1.3');
      setTimeout(() => {
        cube.setAttribute('scale', '1 1 1');
      }, 150);
    });

    // 2. REGISTRO DEL SERVICE WORKER
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker registrado correctamente:', reg.scope))
          .catch((err) => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>

</body>
</html>
