<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Juego AR PWA</title>

  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Juego AR PWA",
    "short_name": "JuegoAR",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#000000",
    "theme_color": "#000000",
    "icons": [
      {
        "src": "https://aframe.io/images/aframe-logo-192.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "https://aframe.io/images/aframe-logo-512.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ]
  }'>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JuegoAR">

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Interfaz Flotante (HUD) */
    #ui-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      text-align: center;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      pointer-events: none; /* Permite interactuar con el lienzo 3D detrás */
    }

    #score-text {
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      letter-spacing: 0.5px;
    }

    #instructions {
      font-size: 13px;
      margin-top: 4px;
      color: #b0bec5;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    <p id="score-text">Puntos: 0</p>
    <div id="instructions">Apunta al marcador HIRO y toca el cubo</div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-marker preset="hiro">
      <a-box 
        id="target-cube" 
        position="0 0.5 0" 
        material="color: #FF5722;" 
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
      </a-box>
    </a-marker>

    <a-entity camera raycaster="objects: a-box" cursor="rayOrigin: mouse"></a-entity>
    
  </a-scene>

  <script>
    // --- LÓGICA DEL JUEGO ---
    let score = 0;
    const colors = ['#FF5722', '#4CAF50', '#2196F3', '#9C27B0', '#FFEB3B', '#E91E63'];
    
    const cube = document.getElementById('target-cube');
    const scoreDisplay = document.getElementById('score-text');

    // Evento táctil / clic sobre el elemento AR
    cube.addEventListener('click', function () {
      score++;
      scoreDisplay.textContent = `Puntos: ${score}`;

      // Cambio aleatorio de color al pulsar
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      cube.setAttribute('material', 'color', randomColor);

      // Animación de feedback al tocar
      cube.setAttribute('scale', '1.3 1.3 1.3');
      setTimeout(() => {
        cube.setAttribute('scale', '1 1 1');
      }, 150);
    });

    // --- REGISTRO DEL SERVICE WORKER INLINE (Para habilitar PWA) ---
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'ar-pwa-v1';
        self.addEventListener('install', (e) => {
          e.waitUntil(
            caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']))
          );
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(
            caches.match(e.request).then((res) => res || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);

      navigator.serviceWorker.register(blobUrl)
        .then(() => console.log('Service Worker PWA registrado con éxito.'))
        .catch((err) => console.log('Error al registrar Service Worker:', err));
    }
  </script>

</body>
</html>
