<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Desafío de Memoria PWA</title>

  <!-- Configuración PWA y Metas -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3612/3612580.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* HUD Header */
    #hud {
      width: 90%;
      max-width: 400px;
      margin-top: 20px;
      background: rgba(30, 41, 59, 0.8);
      padding: 15px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .stat-box {
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
    }

    #score-display { color: #10b981; }
    #timer-display { color: #f59e0b; }

    /* Tablero de Cartas */
    #game-board {
      width: 90%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .card {
      aspect-ratio: 1;
      background-color: #1e293b;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      border: 2px solid #334155;
      transition: transform 0.2s, background-color 0.2s;
    }

    .card:active {
      transform: scale(0.95);
    }

    .card.flipped {
      background-color: #3b82f6;
      border-color: #60a5fa;
    }

    .card.matched {
      background-color: #10b981;
      border-color: #34d399;
      pointer-events: none;
    }

    /* Modal Fin de Juego */
    #game-over-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #game-over-modal h1 {
      font-size: 36px;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .btn-restart {
      margin-top: 25px;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <!-- Marcadores -->
  <div id="hud">
    <div class="stat-box">
      <div class="stat-label">Parejas</div>
      <div class="stat-value" id="score-display">0 / 6</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Tiempo</div>
      <div class="stat-value" id="timer-display">40s</div>
    </div>
  </div>

  <!-- Tablero -->
  <div id="game-board"></div>

  <!-- Modal Resultados -->
  <div id="game-over-modal">
    <h1 id="modal-title">¡Juego Terminado!</h1>
    <p id="final-score" style="font-size: 20px; color: #cbd5e1;"></p>
    <button class="btn-restart" onclick="initGame()">Jugar de Nuevo</button>
  </div>

  <script>
    const emojis = ['🚀', '👾', '💎', '🔥', '⚡', '🎮'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let timeLeft = 40;
    let timerInterval = null;
    let canFlip = true;

    const board = document.getElementById('game-board');
    const scoreDisplay = document.getElementById('score-display');
    const timerDisplay = document.getElementById('timer-display');
    const gameOverModal = document.getElementById('game-over-modal');
    const modalTitle = document.getElementById('modal-title');
    const finalScore = document.getElementById('final-score');

    function initGame() {
      board.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      timeLeft = 40;
      canFlip = true;
      
      scoreDisplay.textContent = `0 / ${emojis.length}`;
      timerDisplay.textContent = `${timeLeft}s`;
      gameOverModal.style.display = 'none';

      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);

      cards.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.emoji = emoji;
        card.dataset.index = index;
        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });
    }

    function updateTimer() {
      timeLeft--;
      timerDisplay.textContent = `${timeLeft}s`;

      if (timeLeft <= 0) {
        endGame(false);
      }
    }

    function flipCard() {
      if (!canFlip || this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');
      this.textContent = this.dataset.emoji;
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      canFlip = false;
      const [card1, card2] = flippedCards;

      if (card1.dataset.emoji === card2.dataset.emoji) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        scoreDisplay.textContent = `${matchedPairs} / ${emojis.length}`;
        flippedCards = [];
        canFlip = true;

        if (matchedPairs === emojis.length) {
          endGame(true);
        }
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          card1.textContent = '';
          card2.textContent = '';
          flippedCards = [];
          canFlip = true;
        }, 800);
      }
    }

    function endGame(isWin) {
      clearInterval(timerInterval);
      gameOverModal.style.display = 'flex';
      
      if (isWin) {
        modalTitle.textContent = '¡Felicidades! 🎉';
        finalScore.textContent = `Ganaste con ${timeLeft} segundos restantes.`;
      } else {
        modalTitle.textContent = '¡Tiempo Agotado! ⏳';
        finalScore.textContent = `Lograste encontrar ${matchedPairs} parejas.`;
      }
    }

    window.onload = initGame;
  </script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker Registrado'))
      .catch((err) => console.log('Error al registrar SW:', err));
  }
</script>
  
</body>
</html>
